[tool.poetry]
name = "golembase-requestor"
version = "0.1.0"
description = "Golem network requestor for Golem Base testnet"

package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
yapapi = "*"
colorama = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88 